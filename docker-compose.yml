version: '3.8'

services:
  # 1. Primary PostgreSQL Database (Metadata, RBAC, Lineage, Logs)
  postgres:
    image: postgres:16-alpine
    container_name: dataflowx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataflowx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DataFlowXSecretPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-dataflowx_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataflowx_user} -d ${POSTGRES_DB:-dataflowx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Distributed Redlock, Celery Broker & Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: dataflowx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO S3 Object Storage (Bronze, Silver, Gold Lakes & Quarantined Parquet)
  minio:
    image: minio/minio:latest
    container_name: dataflowx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin2026!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 4. FastAPI Backend REST API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dataflowx-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-dataflowx_user}:${POSTGRES_PASSWORD:-DataFlowXSecretPass2026!}@postgres:5432/${POSTGRES_DB:-dataflowx_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-dataflowx_user}:${POSTGRES_PASSWORD:-DataFlowXSecretPass2026!}@postgres:5432/${POSTGRES_DB:-dataflowx_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin2026!}
      - S3_BUCKET_NAME=dataflowx-lake
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dfx_super_secret_jwt_master_key_2026_change_in_prod}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Distributed Celery Worker Node
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dataflowx-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-dataflowx_user}:${POSTGRES_PASSWORD:-DataFlowXSecretPass2026!}@postgres:5432/${POSTGRES_DB:-dataflowx_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-dataflowx_user}:${POSTGRES_PASSWORD:-DataFlowXSecretPass2026!}@postgres:5432/${POSTGRES_DB:-dataflowx_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin2026!}
      - S3_BUCKET_NAME=dataflowx-lake
    depends_on:
      - backend
      - redis

  # 6. Distributed Scheduler Daemon (Redlock Enabled)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: dataflowx-scheduler
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-dataflowx_user}:${POSTGRES_PASSWORD:-DataFlowXSecretPass2026!}@postgres:5432/${POSTGRES_DB:-dataflowx_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  # 7. Next.js 14 Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: dataflowx-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # 8. Prometheus Metric Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: dataflowx-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  postgres_data:
  redis_data:
  minio_data:
