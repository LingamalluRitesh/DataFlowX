apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dataflowx-ingress
  namespace: dataflowx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: app.dataflowx.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dataflowx-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dataflowx-frontend
                port:
                  number: 80
